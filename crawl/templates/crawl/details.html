{% extends "base.html" %}

    {% block title %}Crawl :: {{ crawl.name }}{% endblock %}

    {% block head %}
        <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
            /* Only what Bootstrap utilities can't express */
            #map { min-height: 55vh; }

            /* Map Markers */
            .marker-pub {
                background-color: #d3a10e;

                color: #ffffff;
                border: 2px solid #ffffff;
                border-radius: 50%;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  
                /* Center the number inside the circle */
                display: flex;
                align-items: center;
                justify-content: center;
  
                font-family: sans-serif;
                font-weight: bold;
                font-size: 14px;
            }

            .marker-pub-pending {
                background-color: #2b82cb;
            }

            .marker-pub-completed {
                background-color: #838383;
            }

            .marker-pub-active {
                border: 4px double #ffffff;
/*                filter: hue-rotate(150deg) saturate(1.5);*/
            }

            /* Map Path */
            .marching-ants-line {
                /* Defines the dash length and gap length */
                stroke-dasharray: 10, 10; 
                animation: dashFlow 1s linear infinite;
            }

            @keyframes dashFlow {
                to {
                    /* Must equal the negative sum of your dasharray values (10 + 10 = 20) */
                    stroke-dashoffset: -20; 
                }
            }

            /* Sidebar */
            aside {
                padding-bottom: 96px;
            }

@media (max-width: 767.98px) {
  .form-switch .form-check-input {
    width: 3.5em;
    height: 1.75em;
  }
}

        </style>
    {% endblock %}


{% block crawl_name %}
{{crawl.name}}
{% endblock %}

    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- Sidebar -->
            <aside class="col-lg-4 col-xl-3 order-2 order-lg-1 d-flex flex-column border-end bg-body" style="max-height: 100vh;">
                <!-- <header class="p-3 border-bottom"> -->

    <script>

        // Formatters
        function formatDistance(m) {
            return m < 1000 ? m + " m" : (m / 1000).toFixed(1) + " km";
        }

        // Helper function to generate a numbered circle icon
        function createPubPendingIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-pending',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }

        function createPubCompletedIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-completed',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }


        L.helpers = L.helpers || {};
        L.helpers.getLayerGroupBounds = function(layerGroup) {
            const bounds = L.latLngBounds([]);
            layerGroup.eachLayer((layer) => {
                if (layer.getBounds) {
                    // Handles polygons, polylines, rectangles, circles, and nested FeatureGroups
                    bounds.extend(layer.getBounds());
                } else if (layer.getLatLng) {
                    // Handles markers and circleMarkers
                    bounds.extend(layer.getLatLng());
                }
            });
            return bounds;
        }


        class App {
            constructor() {
                this.map = L.map("map", {
                    doubleClickZoom: false, 
                    preferCanvas: true
                });
                this.map.setView([20, 0], 2);

                L.tileLayer.osm().addTo(this.map);

                this.elements = {
                    $status: $("#status"), 
                    $list: $("#list")
                }
            }

            getMap() {
                return this.map;
            }

            getList() {
                return this.elements.$list;
            }

            setStatus(text, isError = false) {
                this.elements.$status.text(text)
                    .toggleClass("text-danger", isError)
                    .toggleClass("text-body-secondary", !isError);
            }
        }


        // Initialize application
        $(function () {


            // Parse the JSON data safely in JavaScript
            var allPubs = JSON.parse(document.getElementById('pubs-json').textContent);
            console.log(allPubs);

            // Full-height two-pane layout on large screens only
            if (window.matchMedia("(min-width: 992px)").matches) $(".row").first().addClass("vh-100");


            const app = new App();

            // Built with jQuery's .text() so venue data is never interpreted as HTML
            function popupContent(pub) {
                const $container = $("<div>").append(
                    $("<strong>").text(pub.name),
                    $("<br>"),
                    document.createTextNode(pub.subtype)
                );
                
                // const addLine = text => $container.append($("<br>"), document.createTextNode(text));
                const addLine = text => $container.append($("<br>"), text);
                if (pub.address_street_number && pub.address_street_name) addLine(`${pub.address_street_number} ${pub.address_street_name}`);
                if (pub.hours) {
                    // addLine("Hours: " + pub.hours);
                    let times = pub.hours.split(';');
                    addLine("Hours: ");
                    for(let i=0; i<times.length; i++) {
                        addLine(`&emsp;${times[i]}`);
                    }
                }
                if (pub.phone) {
                    let cleaned = pub.phone.replaceAll('-');
                    addLine(`🕿 <a href="tel:+${cleaned}">${pub.phone}</a>`);
                }
                if (pub.website && /^https?:\/\//.test(pub.website)) {
                    $container.append(
                        $("<br>"),
                        $("<a>", { href: pub.website, target: "_blank", rel: "noopener" }).text("Website")
                    );
                }
                return $container[0];
            }


            const API = {
                search: function(geom, query) {
                    let geomString = encodeURIComponent(JSON.stringify(geom));
                    if (!query)
                        return $.getJSON(`/api/v1/pubs/search?geom=${geomString}`);
                    let queryString = encodeURIComponent(query);
                    return $.getJSON(`/api/v1/pubs/search?geom=${geomString}&query=${queryString}`);
                }
            }


            {% if user.is_authenticated %}
            /** 
             * AdminAPI
             */
            let crawl_id = {{ crawl.id }};
            const AdminAPI = {
                add: function(pub_id) {
                    $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${pub_id}/add`)
                        .done(response => { 
                            allPubs.push(response.data.pub);
                            renderCrawlLayer();
                        });
                },
                remove: function(pub_id) {
                    $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${pub_id}/remove`)
                        .done(response => { 
                            allPubs = allPubs.filter(d => d.id != pub_id);
                            renderCrawlLayer();
                        });
                },
                complete: function(pub_id) {
                    $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${pub_id}/complete`)
                        .done(response => { 
                            let pub = allPubs.filter(d => d.id == pub_id)[0];
                            pub.completed = true;
                            renderCrawlLayer();
                            $(`.list-group-item-action[data-pub-id="${pub_id}"]`).addClass('active');
                        });
                },
                incomplete: function(pub_id) {
                    $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${pub_id}/incomplete`)
                        .done(response => { 
                            let pub = allPubs.filter(d => d.id == pub_id)[0];
                            pub.completed = false;
                            renderCrawlLayer();
                            $(`.list-group-item-action[data-pub-id="${pub_id}"]`).addClass('active');
                        });
                }
            }

                //             // Create latlng of users location

                //             let bounds = location.toBounds(500);

                //             API.search(geom, query)

                //                     let results = response.data.pubs;

                //                         console.log(results[i]);

                //                 });
                //         },
                //         (error) => {

                //         },
                //         {
                //             enableHighAccuracy: true,
                //             timeout: 30000,
                //             maximumAge: 0
                //         }
                //     );
                // } else {
                //     console.log("Geolocation is not supported by this browser.");
                // }

            }
            $searchInput.on('keyup', debounce(searchPubs, 1500));
            {% endif %}


            /**
             * CrawlLayer
             */
            app.getMap().createPane('crawlPane');
            app.getMap().getPane('crawlPane').style.zIndex = 420;
            const crawlLayer = L.layerGroup().addTo(app.map);

            function makeCrawlPubMarker(i, pub) {
                let icon = !pub.completed ? createPubPendingIcon(i+1) : createPubCompletedIcon(i+1)
                let marker = L.marker([pub.latitude, pub.longitude], { 
                                    icon: icon, 
                                    pane: 'crawlPane' 
                                });

                // Create popup
                let content = popupContent(pub);
                marker.bindPopup(content);

                // Attach event listeners
                marker.on({
                    'mouseover': function (e) {
                        marker._icon.classList.add('marker-pub-active');
                    },
                    'mouseout': function (e) {
                        marker._icon.classList.remove('marker-pub-active');
                    }
                });

                return marker;
            }

            function renderCrawlLayer() {
                // Reset ui elements and map layers
                app.setStatus(`Loading...`);
                crawlLayer.clearLayers();
                app.getList().empty();

                // Loop through pubs
                $.each(allPubs, (i, pub) => {
                    // Create marker and add to 'crawlLayer'
                    const marker = makeCrawlPubMarker(i, pub);
                    marker.addTo(crawlLayer);

                    // Add entry to sidebar
                    let status = pub.completed ? "Complete" : "Incomplete";
                    let _isLast = allPubs[allPubs.length - 1].id == pub.id;
                    let $label = $(`<label class="form-check-label" for="flexSwitchCheckDefault_${pub.id}"></label>`);

                    {% if user.is_authenticated %}
                    // Build menu action items
                    let $completeButton = $(`<a class="dropdown-item" href="#">Complete</a>`).on('click', function(event) {
                        return AdminAPI.complete(pub.id);
                    });

                    let $incompleteButton = $(`<a class="dropdown-item" href="#">Incomplete</a>`).on('click', function(event) {
                        return AdminAPI.incomplete(pub.id);
                    });

                    let $removeButton = $(`<a class="dropdown-item" href="#">Remove</a>`).on('click', function(event) {
                        return AdminAPI.remove(pub.id);
                    });                    

                    let $actionsDropdown = $('<div>', { class: 'dropdown' }).append(
                        $(`<button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Menu</button>`),
                        $('<ul>', { class: 'dropdown-menu' }).append(
                            !pub.completed ? $('<li>').append($completeButton) : null,
                            pub.completed && _isLast ? $('<li>').append($incompleteButton) : null,
                            (!pub.completed && _isLast) ? $('<li>').append($removeButton) : null,
                        )
                    );
                    {% endif %}
                    
                    // Create list item for sidebar
                    let $listItem = $("<div>", { type: "button", class: "list-group-item list-group-item-action" })
                        .attr({'data-pub-id': pub.id})
                        .append(
                            $("<div>", {class: 'clearfix'}).append(
                                $("<div>", { class: "fw-semibold float-start" }).text(pub.name),
                                {% if user.is_authenticated %}
                                $('<div>', { class: 'float-end' }).append(
                                    (0 != $actionsDropdown.find('li').length) && $actionsDropdown,
                                ),
                                {% else %}
                                $('<div>', { class: 'float-end' }).append(status)
                                {% endif %}
                            )
                        )
                        .append(
                            $("<div>", { class: "small text-body-secondary" })
                                .text(
                                    [pub.subtype, `${pub.address_street_number} ${pub.address_street_name}`].filter(Boolean).join(" · ")
                                )
                        )
                        .on("click", function(event) {
                            app.getList().children(".active").removeClass("active");
                            $(this).addClass("active");
                            app.getMap().setView([pub.latitude, pub.longitude], Math.max(app.getMap().getZoom(), 17));
                            marker.openPopup();
                        })
                        .on("mouseover", function(event) {
                            marker._icon.classList.add('marker-pub-active');
                        })
                        .on("mouseout", function(event) {
                            marker._icon.classList.remove('marker-pub-active');
                        });
                    $listItem.appendTo(app.getList());

                    // Highlight list item on marker popup open
                    marker.on('popupopen', function (event) {
                        $('.list-group-item-action').removeClass('active');
                        $listItem.addClass('active');
                    });

                });

                // Set map view
                if (2 == app.getMap().getZoom()) {   // check for starting zoom level
                    if (allPubs.length) {
                        app.getMap().fitBounds(L.helpers.getLayerGroupBounds(crawlLayer).pad(0.1), {'maxZoom': 17});
                    }
                }

                // Update ui elements
                // let n_completed = allPubs.filter(d => d.completed).length;
                if (allPubs.length) app.setStatus(`${allPubs.length} pubs`);
            }

            renderCrawlLayer();


            /** 
             * PubLayer
             */
            // Show nearby Pubs             
            app.getMap().createPane('pubPane');
            app.getMap().getPane('pubPane').style.zIndex = 410;            
            
            const textIcons = {
                'bar': '🍸',
                'pub': '🍺',
                'biergarten': '🍺',
                'brewery': '🍺',
                'restaurant': '🍽️'
            }

            function makePubLayer(geojson) {
                return new L.GeoJSON(geojson, {
                    pointToLayer: function (feature, latlng) {
                        return new L.TextIconCircleMarker(latlng, {
                            // radius: 12,
                            radius: 13,
                            // fillColor: '#d3a10e',
                            // fillColor: '#ffffff',
                            fillColor: '#212529',
                            color: '#000000',
                            weight: 2,
                            fillOpacity: 0.8, 
                            // fillOpacity: 1, 
                            iconText: textIcons[feature.properties.subtype], 
                            iconFont: 'bold 14px sans-serif',
                            pane: 'pubPane' 
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            let content = popupContent(feature.properties);
                            layer.bindPopup(content);
                        }
                        layer.on({
                            'mouseover': function (e) {
                                // layer.openPopup();
                            },
                            'mouseout': function (e) {
                                // layer.closePopup();
                            },
                            'dblclick': function (e) {
                                L.DomEvent.stopPropagation(e);
                                {% if user.is_authenticated %}
                                AdminAPI.add(feature.properties.id);
                                {% endif %}
                            }
                        });
                    }
                });
            }

            var pubLayer = null;
            function renderPubLayer() {
                let bounds = L.rectangle(app.getMap().getBounds()).toGeoJSON();
                API.search(bounds)
                    .done(data => {
                        pubLayer && pubLayer.remove();
                        pubLayer = makePubLayer(data.data.layer);
                        pubLayer.addTo(app.getMap());
                    });
            }

            app.getMap().on('moveend zoomend resize', debounce(renderPubLayer, 1500));

            renderPubLayer();


            // // Draw walking path
            // let pathLayer;
            // let coordinates = allPubs.map(d => `${d.longitude},${d.latitude}`).join(';');
            // let radiuses = allPubs.map(d => `25`).join(';');
            // $.getJSON(`http://router.project-osrm.org/route/v1/foot/${coordinates}?overview=simplified&geometries=geojson`)

            //                 opacity: 0.9,

            //             }

    </script>
