{% extends "base.html" %}

    {% block title %}Crawl :: {{ crawl.name }}{% endblock %}

    {% block head %}
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
            /* Only what Bootstrap utilities can't express */
            #map { min-height: 55vh; }

            /* Map Markers */
            .marker-pub {
                background-color: #d3a10e;

                color: #ffffff;
                border: 2px solid #ffffff;
                border-radius: 50%;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  
                /* Center the number inside the circle */
                display: flex;
                align-items: center;
                justify-content: center;
  
                font-family: sans-serif;
                font-weight: bold;
                font-size: 14px;
            }

            .marker-pub-pending {
                background-color: #2b82cb;
            }

            .marker-pub-completed {
                background-color: #838383;
            }

            /* Map Path */
            .marching-ants-line {
                /* Defines the dash length and gap length */
                stroke-dasharray: 10, 10; 
                animation: dashFlow 1s linear infinite;
            }

            @keyframes dashFlow {
                to {
                    /* Must equal the negative sum of your dasharray values (10 + 10 = 20) */
                    stroke-dashoffset: -20; 
                }
            }

        </style>
    {% endblock %}

{% block content %}
    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- Sidebar -->
            <aside class="col-lg-4 col-xl-3 order-2 order-lg-1 d-flex flex-column border-end bg-body" style="max-height: 100vh;">
                <header class="p-3 border-bottom">
                    <h1 class="h3 mb-3">{{crawl.name}}</h1>
                </header>
                <div id="status" class="px-3 py-2 small text-body-secondary border-bottom" role="status">
                    Loading...
                </div>
                <div id="list" class="list-group list-group-flush overflow-auto flex-grow-1"></div>
            </aside>

            <!-- Map -->
            <main class="col-lg-8 col-xl-9 order-1 order-lg-2">
                <div id="map" class="h-100 w-100"></div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {{ pubs|json_script:"pubs-json" }}
    <script>

        // Helper function to generate a numbered circle icon
        function createPubPendingIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-pending',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }

        function createPubCompletedIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-completed',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }

        // Extend Leaflet's Canvas renderer
        L.Canvas.include({
            _updateCircleWithIcon: function (layer) {
                // Draw the standard circle first
                this._updateCircle(layer);

                if (!layer.options.iconText && !layer.options.iconImg) return;

                const p = layer._point;
                const ctx = this._ctx;

                ctx.save();
                if (layer.options.iconImg && layer.options.iconImg.complete) {
                    const s = layer.options.iconSize || 16;
                    ctx.drawImage(layer.options.iconImg, p.x - s / 2, p.y - s / 2, s, s);
                } else if (layer.options.iconText) {
                    ctx.fillStyle = layer.options.iconColor || '#ffffff';
                    ctx.font = layer.options.iconFont || 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(layer.options.iconText, p.x, p.y);
                }
                ctx.restore();
            }
        });

        // Create a custom CircleMarker class
        L.TextIconCircleMarker = L.CircleMarker.extend({
            _updatePath: function () {
                this._renderer._updateCircleWithIcon(this);
            }
        });


        // Initialize application
        $(function () {

            // Parse the JSON data safely in JavaScript
            const allPubs = JSON.parse(document.getElementById('pubs-json').textContent);
            console.log(allPubs);

            // Full-height two-pane layout on large screens only
            if (window.matchMedia("(min-width: 992px)").matches) $(".row").first().addClass("vh-100");

            const map = L.map("map", {
                doubleClickZoom: false, 
                preferCanvas: true
            }).setView([20, 0], 2);
            
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19, 
                attribution: "&copy; OpenStreetMap contributors",
                referrerPolicy: 'no-referrer-when-downgrade'
            }).addTo(map);
            
            map.createPane('crawlPane');
            map.getPane('crawlPane').style.zIndex = 420;
            const crawlLayer = L.layerGroup().addTo(map);

            const $status = $("#status"), 
                  $list = $("#list"), 
                  $type = $("#type"), 
                  $name = $("#name");
            let label = "";

            function formatDistance(m) {
                return m < 1000 ? m + " m" : (m / 1000).toFixed(1) + " km";
            }

            function setStatus(text, isError = false) {
                $status.text(text)
                    .toggleClass("text-danger", isError)
                    .toggleClass("text-body-secondary", !isError);
            }

            // Built with jQuery's .text() so venue data is never interpreted as HTML
            function popupContent(pub) {
                const $p = $("<div>").append(
                    $("<strong>").text(pub.name),
                    $("<br>"),
                    document.createTextNode(pub.subtype)
                );
                
                const addLine = text => $p.append($("<br>"), document.createTextNode(text));
                if (pub.address_street_number && pub.address_street_name) addLine(`${pub.address_street_number} ${pub.address_street_name}`);
                if (pub.hours) addLine("Hours: " + pub.hours);
                if (pub.phone) addLine(pub.phone);
                if (pub.website && /^https?:\/\//.test(pub.website)) {
                    $p.append(
                        $("<br>"),
                        $("<a>", { href: pub.website, target: "_blank", rel: "noopener" }).text("Website")
                    );
                }
                return $p[0];
            }

            function render() {
                const type = $type.val(), q = $.trim($name.val()).toLowerCase();
                const pubs = $.grep(allPubs, pub =>
                    (!type || pub.subtype === type) && (!q || pub.name.toLowerCase().includes(q)));

                crawlLayer.clearLayers();
                $list.empty();

                $.each(pubs, (i, pub) => {
                    let icon = !pub.completed ? createPubPendingIcon(i+1) : createPubCompletedIcon(i+1)
                    const marker = L.marker([pub.latitude, pub.longitude], { icon: icon, pane: 'crawlPane' });
                    marker.bindPopup(popupContent(pub));
                    marker.addTo(crawlLayer);

                    $("<button>", { type: "button", class: "list-group-item list-group-item-action" })
                        .append($("<div>", { class: "fw-semibold" }).text(pub.name))
                        .append($("<div>", { class: "small text-body-secondary" })
                        .text([pub.subtype, pub.distance_m != null ? formatDistance(pub.distance_m) : null, pub.address]
                        .filter(Boolean).join(" · ")))
                        .on("click", function () {
                            $list.children(".active").removeClass("active");
                            $(this).addClass("active");
                            map.setView([pub.latitude, pub.longitude], Math.max(map.getZoom(), 16));
                            marker.openPopup();
                        })
                        .appendTo($list);

                    {% if user.is_authenticated %}
                    // Remove pub to crawl
                    marker.on({
                        'dblclick': function (e) {
                            L.DomEvent.stopPropagation(e);
                            {% if user.is_authenticated %}
                            // Remove pub to crawl
                            let crawl_id = {{ crawl.id }};
                            $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${pub.id}/remove`)
                                .done(response => { 
                                    allPubs = allPubs.filter(d => d.id != pub.id);
                                    render();
                                });
                            {% endif %}
                        }
                    });
            });

            if (pubs.length) map.fitBounds(L.latLngBounds($.map(pubs, pub => [[pub.latitude, pub.longitude]])).pad(0.1));
            if (allPubs.length) setStatus(`${pubs.length} of ${allPubs.length} pubs ${label}`);

            // // Draw walking path
            // let pathLayer;
            // let coordinates = allPubs.map(d => `${d.longitude},${d.latitude}`).join(';');
            // let radiuses = allPubs.map(d => `25`).join(';');
            // $.getJSON(`http://router.project-osrm.org/route/v1/foot/${coordinates}?overview=simplified&geometries=geojson`)
            //     .done(data => {
            //         console.log(data);
            //         pathLayer && pathLayer.remove();
            //         pathLayer = new L.GeoJSON(data.routes[0].geometry, {
            //             style: {
            //                 color: '#ff5722',
            //                 weight: 4,
            //                 opacity: 0.9,
            //                 className: 'marching-ants-line' 
            //             }
            //         });
            //         pathLayer.addTo(map);
            //     });

            // Show nearby Pubs             
            map.createPane('pubPane');
            map.getPane('pubPane').style.zIndex = 410;            
            
            let pubLayer;
            function renderPubLayer() {
                let bounds = L.rectangle(map.getBounds()).toGeoJSON();
                let geom = encodeURIComponent(JSON.stringify(bounds));
                $.getJSON(`/api/v1/pubs/search?geom=${geom}`)
                    .done(data => {
                        // let icon = createPubIcon();
                        pubLayer && pubLayer.remove();
                        pubLayer = new L.GeoJSON(data.data.layer, {
                            pointToLayer: function (feature, latlng) {
                                return new L.TextIconCircleMarker(latlng, {
                                    radius: 12,
                                    fillColor: '#d3a10e',
                                    color: '#000000',
                                    weight: 2,
                                    fillOpacity: 0.8, 
                                    iconText: '🍺', 
                                    pane: 'pubPane' 
                                });
                            },
                            onEachFeature: function (feature, layer) {
                                if (feature.properties && feature.properties.name) {
                                    layer.bindPopup(feature.properties.name);
                                }

                                layer.on({
                                    'mouseover': function (e) {
                                        layer.openPopup();
                                    },
                                    'mouseout': function (e) {
                                        layer.closePopup();
                                    },
                                    'dblclick': function (e) {
                                        L.DomEvent.stopPropagation(e);
                                        {% if user.is_authenticated %}
                                        // Add pub to crawl
                                        let crawl_id = {{ crawl.id }};
                                        $.getJSON(`/api/v1/crawl/${crawl_id}/pub/${feature.properties.id}/add`)
                                            .done(response => { 
                                                allPubs.push(response.data.pub);
                                                render();
                                            });
                                        {% endif %}
                                    }
                                });

                            }
                        });
                        pubLayer.addTo(map);
                    });
            }

            let pubLayerRenderTimeout;
            map.on('moveend zoomend resize', function(event) {
                clearTimeout(pubLayerRenderTimeout);
                pubLayerRenderTimeout = setTimeout(renderPubLayer, 1500);
            });

            renderPubLayer();
        }

        render();

    });
  </script>
{% endblock %}
