{% extends "base.html" %}

    {% block title %}Crawl :: {{ crawl.name }}{% endblock %}

    {% block head %}
        <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
            /* Only what Bootstrap utilities can't express */
            #map { min-height: 55vh; }

            /* Map Markers */
            .marker-pub {
                background-color: #d3a10e;

                color: #ffffff;
                border: 2px solid #ffffff;
                border-radius: 50%;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  
                /* Center the number inside the circle */
                display: flex;
                align-items: center;
                justify-content: center;
  
                font-family: sans-serif;
                font-weight: bold;
                font-size: 14px;
            }

            .marker-pub-pending {
                background-color: #2b82cb;
            }

            .marker-pub-completed {
                background-color: #838383;
            }

            .marker-pub-active {
                border: 4px double #ffffff;
/*                filter: hue-rotate(150deg) saturate(1.5);*/
            }

            /* Map Path */
            .marching-ants-line {
                /* Defines the dash length and gap length */
                stroke-dasharray: 10, 10; 
                animation: dashFlow 1s linear infinite;
            }

            @keyframes dashFlow {
                to {
                    /* Must equal the negative sum of your dasharray values (10 + 10 = 20) */
                    stroke-dashoffset: -20; 
                }
            }

            /* Sidebar */
            aside {
                padding-bottom: 96px;
            }

@media (max-width: 767.98px) {
  .form-switch .form-check-input {
    width: 3.5em;
    height: 1.75em;
  }
}

        </style>
    {% endblock %}


{% block crawl_name %}
{{crawl.name}}
{% endblock %}

{% block content %}

    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- Sidebar -->
            <aside class="col-lg-4 col-xl-3 order-2 order-lg-1 d-flex flex-column border-end bg-body" style="max-height: 100vh;">
                <!-- <header class="p-3 border-bottom"> -->
                    <!-- <h1 class="h3 mb-3">{{crawl.name}}</h1> -->
                    <!-- <h1 class="h3">{{crawl.name}}</h1> -->
                <!-- </header> -->

                {% if user.is_authenticated %}
                <div class="dropdown border-bottom p-2">
                    <input 
                      type="text" 
                      id="searchInput" 
                      class="form-control" 
                      placeholder="Search pubs..." 
                      autocomplete="off"
                    >
                    <ul id="searchResults" class="dropdown-menu w-100 shadow-sm"></ul>
                </div>
                {% endif %}

                <!-- <div id="status" class="px-3 py-2 small text-body-secondary border-bottom" role="status"></div> -->
                <div id="list" class="list-group list-group-flush overflow-auto flex-grow-1"></div>
            </aside>

            <!-- Map -->
            <main class="col-lg-8 col-xl-9 order-1 order-lg-2">
                <div id="map" class="h-100 w-100"></div>
            </main>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom Leaflet Plugins -->
    <script src="https://cdn.jsdelivr.net/gh/sjsafranek/leaflet-custom-plugins@main/L.tileLayer.osm.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sjsafranek/leaflet-custom-plugins@main/L.TextIconCircleMarker.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sjsafranek/leaflet-custom-plugins@main/L.LayerGroup.extensions.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sjsafranek/js-helpers@main/utils.js"></script>

    {{ pubs|json_script:"pubs-json" }}
    <script>

        // Formatters
        function formatDistance(m) {
            return m < 1000 ? m + " m" : (m / 1000).toFixed(1) + " km";
        }

        // Helper function to generate a numbered circle icon
        function createPubPendingIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-pending',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }

        function createPubCompletedIcon(number) {
            return L.divIcon({
                className: 'marker-pub marker-pub-completed',
                html: `<span>${number}</span>`,
                iconSize: [30, 30],   // Width and height of the circle
                iconAnchor: [15, 15]  // Center point of the icon (half of iconSize)
            });
        }


        /**
         * API 
         */
        const API = {
            crawlId: {{ crawl.id }},

            search: function(geom, query) {
                let geomString = encodeURIComponent(JSON.stringify(geom));
                if (!query)
                    return $.getJSON(`/api/v1/pubs/search?geom=${geomString}`);
                let queryString = encodeURIComponent(query);
                return $.getJSON(`/api/v1/pubs/search?geom=${geomString}&query=${queryString}`);
            }
        }

        {% if user.is_authenticated %}

        API.addPubToCrawl = function(pub_id) {
            return $.getJSON(`/api/v1/crawl/${API.crawlId}/pub/${pub_id}/add`);
        }

        API.removePubFromCrawl = function(pub_id) {
            return $.getJSON(`/api/v1/crawl/${API.crawlId}/pub/${pub_id}/remove`);
        }

        API.markPubAsComplete = function(pub_id) {
            return $.getJSON(`/api/v1/crawl/${API.crawlId}/pub/${pub_id}/complete`);
        }

        API.markPubAsIncomplete = function(pub_id) {
            return $.getJSON(`/api/v1/crawl/${API.crawlId}/pub/${pub_id}/incomplete`);
        }

        {% endif %}



        class EventEmitter {
            constructor() {
                this.events = new Map();
            }

            // Subscribe to an event
            on(eventName, listener) {
                if (!this.events.has(eventName)) {
                this.events.set(eventName, new Set());
                }
                this.events.get(eventName).add(listener);
                return this; // Enables method chaining
            }

            // Unsubscribe from an event
            off(eventName, listener) {
                if (this.events.has(eventName)) {
                    this.events.get(eventName).delete(listener);
                }
                return this;
            }

            // Subscribe to an event only once
            once(eventName, listener) {
                const wrapper = (...args) => {
                    this.off(eventName, wrapper);
                    listener(...args);
                };
                return this.on(eventName, wrapper);
            }

            // Trigger an event
            emit(eventName, ...args) {
                if (!this.events.has(eventName)) return false;
                for (const listener of this.events.get(eventName)) {
                    listener(...args);
                }
                return true;
            }
        }


        /**
         * App 
         */
        class App extends EventEmitter {
            constructor(data) {
                // Calls the parent constructor; MUST be called before using 'this'
                super(); 

                let self = this;

                this.data = data || [];

                // Initialize leaflet map
                this.map = L.map("map", {
                    doubleClickZoom: false, 
                    preferCanvas: true
                });
                this.map.setView([20, 0], 2);
                L.tileLayer.osm().addTo(this.map);

                // Attach ui elements
                this.elements = {
                    $status: $("#status"), 
                    $list: $("#list")
                }

                // Create map layers
                this.layers = {};

                // Attach listeners
                this.getMap().on('moveend zoomend resize', debounce(function(event) { self.renderPubLayer(); }, 1500));
            }

            getData() {
                return this.data;
            }

            setData(data) {
                this.data = data;
            }

            getMap() {
                return this.map;
            }

            getList() {
                return this.elements.$list;
            }

            // setStatus(text, isError = false) {
            //     this.getElement('status').text(text)
            //         .toggleClass("text-danger", isError)
            //         .toggleClass("text-body-secondary", !isError);
            // }

            getElement(name) {
                return this.elements[`$${name}`];
            }

            getLayer(name) {
                return this.layers[name];
            }

            addLayer(name, layer) {
                this.layers[name] && this.layers[name].remove();
                this.layers[name] = layer;
                this.layers[name].addTo(this.getMap());
            }

            /**
             * API Handlers 
             */
            addPubToCrawl(pub) {
                let self = this;
                return API.addPubToCrawl(pub.id)
                            .done(response => { 
                                self.getData().push(response.data.pub);
                            })
                            .then(() => { self.render(); });
            }

            removePubFromCrawl(pub) {
                let self = this;
                return API.removePubFromCrawl(pub.id)
                            .done(response => { 
                                self.data = self.getData().filter(d => d.id != pub.id);
                            })
                            .then(() => { self.render(); });
            }

            markPubAsComplete(pub) {
                let self = this;
                return API.markPubAsComplete(pub.id)
                            .done(response => { 
                                self.getData().filter(d => d.id == pub.id)[0].completed = true;
                            })
                            .then(() => { self.render(); });
            }

            markPubAsIncomplete(pub) {
                let self = this;
                return API.markPubAsIncomplete(pub.id)
                            .done(response => { 
                                self.getData().filter(d => d.id == pub.id)[0].completed = false;
                            })
                            .then(() => { self.render(); });
            }
            
            /** 
             * PubLayer
             */
            _makePubLayer(geojson) {
                // Create new layer pane if needed
                if (!this.getMap().getPane('pubPane')) {
                    this.getMap().createPane('pubPane');
                    this.getMap().getPane('pubPane').style.zIndex = 410;  
                }

                // Define text icons for markers
                const textIcons = {
                    'bar': '🍸',
                    'pub': '🍺',
                    'biergarten': '🍺',
                    'brewery': '🍺',
                    'restaurant': '🍽️'
                }

                // Initialize GeoJSON layer
                return new L.GeoJSON(geojson, {
                    pointToLayer: function (feature, latlng) {
                        return new L.TextIconCircleMarker(latlng, {
                            radius: 13,
                            fillColor: '#212529',
                            color: '#000000',
                            weight: 2,
                            fillOpacity: 0.8, 
                            iconText: textIcons[feature.properties.subtype], 
                            iconFont: 'bold 14px sans-serif',
                            pane: 'pubPane' 
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            let content = App.makePopupContentForPub(feature.properties);
                            layer.bindPopup(content);
                        }
                        layer.on({
                            'click': function(event) {
                                console.log(feature.properties);
                            }
                        });
                    }
                });
            }

            renderPubLayer() {
                let self = this;
                let bounds = L.rectangle(this.getMap().getBounds()).toGeoJSON();
                API.search(bounds)
                    .done(data => {
                        let pubLayer = self._makePubLayer(data.data.layer);
                        self.addLayer('pubs', pubLayer);
                    });
            }

            /** 
             * CrawlLayer
             */
            render() {
                let self = this;
                // Create new layer pane if needed
                if (!this.getMap().getPane('crawlPane')) {
                    this.getMap().createPane('crawlPane');
                    this.getMap().getPane('crawlPane').style.zIndex = 420;
                }

                // Create new layer if needed
                if (!this.getLayer('crawl')) {
                    this.addLayer('crawl', L.layerGroup());
                }

                // Reset ui elements and map layers
                let layer = this.getLayer('crawl');
                layer.clearLayers();
                this.getList().empty();

                // Loop through pubs
                let pubs = this.getData();
                $.each(pubs, (i, pub) => {
                    // Create marker and add to 'crawlLayer'
                    const marker = App.makeCrawlPubMarker(pub);
                    marker.addTo(layer);

                    // Add entry to sidebar
                    let status = pub.completed ? "Complete" : "Incomplete";
                    let _isLast = pubs[pubs.length - 1].id == pub.id;
                    let $label = $(`<label class="form-check-label" for="flexSwitchCheckDefault_${pub.id}"></label>`);

                    {% if user.is_authenticated %}
                    // Build menu action items
                    let $completeButton = $(`<a class="dropdown-item" href="#">Complete</a>`).on('click', function(event) {
                        return self.markPubAsComplete(pub)
                                    .then(() => {
                                        $(`.list-group-item-action[data-pub-id="${pub.id}"]`).addClass('active');
                                    });
                    });

                    let $incompleteButton = $(`<a class="dropdown-item" href="#">Incomplete</a>`).on('click', function(event) {
                        return self.markPubAsIncomplete(pub)
                                    .then(() => {
                                        $(`.list-group-item-action[data-pub-id="${pub.id}"]`).addClass('active');
                                    });
                    });

                    let $removeButton = $(`<a class="dropdown-item" href="#">Remove</a>`).on('click', function(event) {
                        return self.removePubFromCrawl(pub);
                    });                    

                    let $actionsDropdown = $('<div>', { class: 'dropdown' }).append(
                        $(`<button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Menu</button>`),
                        $('<ul>', { class: 'dropdown-menu' }).append(
                            !pub.completed ? $('<li>').append($completeButton) : null,
                            pub.completed && _isLast ? $('<li>').append($incompleteButton) : null,
                            (!pub.completed && _isLast) ? $('<li>').append($removeButton) : null,
                        )
                    );
                    {% endif %}
                    
                    // Create list item for sidebar
                    let $listItem = $("<div>", { type: "button", class: "list-group-item list-group-item-action" })
                        .attr({'data-pub-id': pub.id})
                        .append(
                            $("<div>", {class: 'clearfix'}).append(
                                $("<div>", { class: "fw-semibold float-start" }).text(pub.name),
                                {% if user.is_authenticated %}
                                $('<div>', { class: 'float-end' }).append(
                                    (0 != $actionsDropdown.find('li').length) && $actionsDropdown,
                                ),
                                {% else %}
                                $('<div>', { class: 'float-end' }).append(status)
                                {% endif %}
                            )
                        )
                        .append(
                            $("<div>", { class: "small text-body-secondary" })
                                .text(
                                    [pub.subtype, `${pub.address_street_number} ${pub.address_street_name}`].filter(Boolean).join(" · ")
                                )
                        )
                        .on("click", function(event) {
                            self.getList().children(".active").removeClass("active");
                            $(this).addClass("active");
                            self.getMap().setView([pub.latitude, pub.longitude], Math.max(self.getMap().getZoom(), 17));
                            marker.openPopup();
                        })
                        .on("mouseover", function(event) {
                            marker._icon.classList.add('marker-pub-active');
                        })
                        .on("mouseout", function(event) {
                            marker._icon.classList.remove('marker-pub-active');
                        });
                    $listItem.appendTo(self.getList());

                    // Highlight list item on marker popup open
                    marker.on('popupopen', function (event) {
                        $('.list-group-item-action').removeClass('active');
                        $listItem.addClass('active');
                    });

                });

                // Set map view
                if (2 == this.getMap().getZoom()) {   // check for starting zoom level
                    if (pubs.length) {
                        let bounds = this.getLayer('crawl').getBounds();
                        this.getMap().fitBounds(bounds.pad(0.1), {'maxZoom': 17});
                    }
                }

                this.emit('onrender');
            }


            // Make marker for craw pub
            static makeCrawlPubMarker(pub) {
                let icon = !pub.completed ? createPubPendingIcon(pub.position) : createPubCompletedIcon(pub.position)
                let marker = L.marker([pub.latitude, pub.longitude], { 
                                    icon: icon, 
                                    pane: 'crawlPane' 
                                });

                // Create popup
                let content = App.makePopupContentForPub(pub);
                marker.bindPopup(content);

                // Attach event listeners
                marker.on({
                    'mouseover': function (e) {
                        marker._icon.classList.add('marker-pub-active');
                    },
                    'mouseout': function (e) {
                        marker._icon.classList.remove('marker-pub-active');
                    }
                });

                return marker;
            }

            // Built with jQuery's .text() so venue data is never interpreted as HTML
            static makePopupContentForPub(pub) {
                const $container = $("<div>").append(
                    $("<strong>").text(pub.name),
                    $("<br>"),
                    document.createTextNode(pub.subtype)
                );
                
                // const addLine = text => $container.append($("<br>"), document.createTextNode(text));
                const addLine = text => $container.append($("<br>"), text);
                if (pub.address_street_number && pub.address_street_name) addLine(`${pub.address_street_number} ${pub.address_street_name}`);
                if (pub.hours) {
                    // addLine("Hours: " + pub.hours);
                    let times = pub.hours.split(';');
                    addLine("Hours: ");
                    for(let i=0; i<times.length; i++) {
                        addLine(`&emsp;${times[i]}`);
                    }
                }
                if (pub.phone) {
                    let cleaned = pub.phone.replaceAll('-');
                    addLine(`🕿 <a href="tel:+${cleaned}">${pub.phone}</a>`);
                }
                if (pub.website && /^https?:\/\//.test(pub.website)) {
                    $container.append(
                        $("<br>"),
                        $("<a>", { href: pub.website, target: "_blank", rel: "noopener" }).text("Website")
                    );
                }
                return $container[0];
            }
        }


        // Initialize application
        $(function () {

            // Full-height two-pane layout on large screens only
            if (window.matchMedia("(min-width: 992px)").matches) $(".row").first().addClass("vh-100");

            // Parse the JSON data safely in JavaScript
            var pubs = JSON.parse(document.getElementById('pubs-json').textContent);
            console.log(pubs);

            // Initialize app
            const app = new App(pubs);
            window.app = app;

            {% if user.is_authenticated %}

            /**
             * Pub Search 
             */
            app.elements.$searchInput = $('#searchInput');
            app.elements.$searchResults = $('#searchResults');

            app.searchPubsWithQuery = function(event) {
                let self = this;
                let $searchInput = this.getElement('searchInput');
                let $searchResults = this.getElement('searchResults');

                let query = $searchInput.val().trim();
                if (query.length < 2) {
                    $searchResults.removeClass('show');
                    return;
                }

                let bounds = L.rectangle(app.getMap().getCenter().toBounds(1000)).toGeoJSON();
                API.search(bounds, query)
                    .done(response => {
                        let results = response.data.layer.features.map(d => d.properties);
                        self.renderSearchResultsDropdown(results);
                    });
            }

            app.renderSearchResultsDropdown = function(items) {
                let $searchInput = this.getElement('searchInput');
                let $searchResults = this.getElement('searchResults');
                $searchResults.empty();
                if (items.length === 0) {
                    $searchResults[0].innerHTML = '<li><span class="dropdown-item-text text-muted">No results found</span></li>';
                } else {
                    items.forEach(pub => {
                        let $li = $('<li>').append(
                            $('<a>', { class: 'dropdown-item', href: '#' }).append(
                                    $('<strong>').append(pub.name),
                                    " · ",
                                    `${pub.address_street_number} ${pub.address_street_name}`
                                )
                                .on('click', function(event) {
                                    event.preventDefault();
                                    $searchInput.get(0).value = pub.name;
                                    $searchResults.removeClass('show');
                                    
                                    app.addPubToCrawl(pub)
                                        .then(() => {
                                            $searchInput.val(null);
                                            $searchResults.empty();
                                        });
                                })
                        );
                        $searchResults.append($li);
                    });
                }
                $searchResults.addClass('show');
            }

            // Hide dropdown when clicking outside
            document.addEventListener('click', (e) => {
                let searchInput = app.getElement('searchInput').get(0)
                let searchResults = app.getElement('searchResults').get(0); 
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.classList.remove('show');
                }
            });

            app.getElement('searchInput').on('keyup', debounce(function(event) { app.searchPubsWithQuery(event); }, 1000));

            app.on('onrender', function() {
                let disabled = (2 <= app.getData().filter(d => !d.completed).length);
                let $searchInput = app.getElement('searchInput');
                $searchInput.prop('disabled', disabled);
                $searchInput.attr('placeholder', disabled ? 'Please complete existing pubs' : 'Search pubs...')
            });

            {% endif %}


            app.render();

        });

    </script>

{% endblock %}
