<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}PubCrawler{% endblock %}</title>

    <script>
        // Follow the OS light/dark setting using Bootstrap's color modes
        const dark = matchMedia("(prefers-color-scheme: dark)");
        const applyTheme = () => document.documentElement.setAttribute("data-bs-theme", dark.matches ? "dark" : "light");
        applyTheme(); dark.addEventListener("change", applyTheme);
    </script>

    {% block head %}
    <!-- Child templates will inject content here -->
    {% endblock %}

</head>
<body>
<!--     <header>
        <h1>Welcome to My Website</h1>
    </header> -->

    <main>
        {% block content %}
        <!-- Child templates will inject content here -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 PubCrawler</p>
    </footer>
</body>
</html>
