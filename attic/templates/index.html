<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bar Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    /* Only what Bootstrap utilities can't express */
    #map { min-height: 55vh; }
  </style>
  <script>
    // Follow the OS light/dark setting using Bootstrap's color modes
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const applyTheme = () => document.documentElement.setAttribute("data-bs-theme", dark.matches ? "dark" : "light");
    applyTheme(); dark.addEventListener("change", applyTheme);
  </script>
</head>
<body>
  <div class="container-fluid p-0">
    <div class="row g-0">
      <!-- Sidebar -->
      <aside class="col-lg-4 col-xl-3 order-2 order-lg-1 d-flex flex-column border-end bg-body" style="max-height: 100vh;">
        <header class="p-3 border-bottom">
          <h1 class="h3 mb-3">Bar Finder</h1>
          <div class="input-group mb-2">
            <input id="city" type="text" class="form-control" placeholder="City, e.g. Portland, Oregon" autocomplete="off" aria-label="City">
            <button id="go" class="btn btn-primary" type="button">
              <span id="spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
              Search
            </button>
          </div>
          <div class="input-group">
            <select id="type" class="form-select" aria-label="Venue type">
              <option value="">Bars and pubs</option>
              <option value="bar">Bars only</option>
              <option value="pub">Pubs only</option>
            </select>
            <input id="name" type="text" class="form-control" placeholder="Filter by name" aria-label="Filter by name">
          </div>
          <div class="input-group mt-2">
            <select id="radius" class="form-select flex-grow-0 w-auto" aria-label="Search radius">
              <option value="500">500 m</option>
              <option value="1000" selected>1 km</option>
              <option value="2000">2 km</option>
              <option value="5000">5 km</option>
            </select>
            <button id="near" class="btn btn-outline-primary flex-grow-1" type="button">
              <span id="near-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
              Search near me
            </button>
          </div>
        </header>
        <div id="status" class="px-3 py-2 small text-body-secondary border-bottom" role="status">
          Search for a city to see its bars on the map.
        </div>
        <div id="list" class="list-group list-group-flush overflow-auto flex-grow-1"></div>
      </aside>

      <!-- Map -->
      <main class="col-lg-8 col-xl-9 order-1 order-lg-2">
        <div id="map" class="h-100 w-100"></div>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(function () {
      // Full-height two-pane layout on large screens only
      if (window.matchMedia("(min-width: 992px)").matches) $(".row").first().addClass("vh-100");

      const map = L.map("map").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
      const layer = L.layerGroup().addTo(map);
      const areaLayer = L.layerGroup().addTo(map); // "you are here" marker + search radius circle

      const $city = $("#city"), $go = $("#go"), $spinner = $("#spinner"),
            $status = $("#status"), $list = $("#list"), $type = $("#type"), $name = $("#name"),
            $near = $("#near"), $nearSpinner = $("#near-spinner"), $radius = $("#radius");
      let allBars = [], label = "";

      function setBusy(busy, $spin) {
        $go.prop("disabled", busy);
        $near.prop("disabled", busy);
        $spin.toggleClass("d-none", !busy);
      }

      function formatDistance(m) {
        return m < 1000 ? m + " m" : (m / 1000).toFixed(1) + " km";
      }

      function setStatus(text, isError = false) {
        $status.text(text)
          .toggleClass("text-danger", isError)
          .toggleClass("text-body-secondary", !isError);
      }

      // Built with jQuery's .text() so venue data is never interpreted as HTML
      function popupContent(b) {
        const $p = $("<div>").append($("<strong>").text(b.name)).append($("<br>")).append(document.createTextNode(b.type));
        const addLine = text => $p.append($("<br>")).append(document.createTextNode(text));
        if (b.address) addLine(b.address);
        if (b.hours) addLine("Hours: " + b.hours);
        if (b.phone) addLine(b.phone);
        if (b.website && /^https?:\/\//.test(b.website)) {
          $p.append($("<br>")).append(
            $("<a>", { href: b.website, target: "_blank", rel: "noopener" }).text("Website")
          );
        }
        return $p[0];
      }

      function render() {
        const type = $type.val(), q = $.trim($name.val()).toLowerCase();
        const bars = $.grep(allBars, b =>
          (!type || b.type === type) && (!q || b.name.toLowerCase().includes(q)));

        layer.clearLayers();
        $list.empty();

        $.each(bars, (_, b) => {
          const marker = L.circleMarker([b.lat, b.lon], {
            radius: 7, weight: 2, color: "#0a58ca", fillColor: "#6ea8fe", fillOpacity: 0.9
          }).bindPopup(popupContent(b)).addTo(layer);

          $("<button>", { type: "button", class: "list-group-item list-group-item-action" })
            .append($("<div>", { class: "fw-semibold" }).text(b.name))
            .append($("<div>", { class: "small text-body-secondary" })
              .text([b.type, b.distance_m != null ? formatDistance(b.distance_m) : null, b.address]
                .filter(Boolean).join(" · ")))
            .on("click", function () {
              $list.children(".active").removeClass("active");
              $(this).addClass("active");
              map.setView([b.lat, b.lon], Math.max(map.getZoom(), 16));
              marker.openPopup();
            })
            .appendTo($list);
        });

        if (bars.length) map.fitBounds(L.latLngBounds($.map(bars, b => [[b.lat, b.lon]])).pad(0.1));
        if (allBars.length) setStatus(`${bars.length} of ${allBars.length} venues ${label}`);
      }

      function search() {
        const q = $.trim($city.val());
        if (!q) return setStatus("Enter a city to search.", true);

        setBusy(true, $spinner);
        setStatus(`Looking up bars in ${q}… the first search for a city can take a minute.`);

        $.getJSON("/api/bars", { city: q })
          .done(data => {
            allBars = data.bars;
            label = "in " + data.city;
            areaLayer.clearLayers();
            render();
          })
          .fail(xhr => {
            allBars = [];
            layer.clearLayers();
            $list.empty();
            const msg = (xhr.responseJSON && xhr.responseJSON.error) || "Search failed. Is the server running?";
            setStatus(msg, true);
          })
          .always(() => setBusy(false, $spinner));
      }

      function searchNearMe() {
        if (!navigator.geolocation) {
          return setStatus("This browser doesn't support location lookup.", true);
        }
        setBusy(true, $nearSpinner);
        setStatus("Getting your location…");

        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude: lat, longitude: lon } = pos.coords;
          const radius = +$radius.val();
          setStatus(`Looking up bars within ${formatDistance(radius)} of you…`);

          $.getJSON("/api/bars/nearby", { lat, lon, radius })
            .done(data => {
              allBars = data.bars;
              label = `within ${formatDistance(radius)} of you`;

              areaLayer.clearLayers();
              L.circleMarker([lat, lon], {
                radius: 8, weight: 3, color: "#fff", fillColor: "#dc3545", fillOpacity: 1
              }).bindTooltip("You are here").addTo(areaLayer);
              const circle = L.circle([lat, lon], {
                radius, color: "#dc3545", weight: 1, fillOpacity: 0.05
              }).addTo(areaLayer);

              render();
              map.fitBounds(circle.getBounds());
              if (!data.count) setStatus(`No bars or pubs mapped within ${formatDistance(radius)} of you. Try a larger radius.`);
            })
            .fail(xhr => {
              allBars = [];
              layer.clearLayers();
              $list.empty();
              setStatus((xhr.responseJSON && xhr.responseJSON.error) || "Search failed. Is the server running?", true);
            })
            .always(() => setBusy(false, $nearSpinner));
        }, err => {
          const reasons = {
            1: "Location access was blocked. Allow it in your browser's site settings and try again.",
            2: "Your location isn't available right now.",
            3: "Finding your location timed out. Try again."
          };
          setStatus(reasons[err.code] || "Couldn't get your location.", true);
          setBusy(false, $nearSpinner);
        }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
      }

      $go.on("click", search);
      $near.on("click", searchNearMe);
      $city.on("keydown", e => { if (e.key === "Enter") search(); });
      $type.on("change", render);
      $name.on("input", render);
    });
  </script>
</body>
</html>
